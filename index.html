<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#sobre">Sobre</a></li>
                <li><a href="#projetos">Projetos</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="sobre">
            <h1>Olá, eu sou um Desenvolvedor Web</h1>
            <p>Este é o meu projeto final para o curso da Coursera.</p>
            <img src="https://via.placeholder.com/150" alt="Foto de perfil do desenvolvedor">
        </section>

        <section id="projetos">
            <h2>Meus Projetos</h2>
            <div class="projeto-card">
                <h3>Projeto 1</h3>
                <p>Descrição do projeto realizado com HTML e CSS.</p>
            </div>
        </section>

        <section id="contato">
            <h2>Contato</h2>
            <form id="form-contato">
                <input type="email" id="email" placeholder="Seu e-mail" required>
                <button type="submit">Enviar</button>
            </form>
            <p id="mensagem-sucesso" style="display:none;">Obrigado! Entraremos em contato.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Desenvolvido por Mim</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
